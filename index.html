<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>WebGPU Aquarium</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="A procedurally generated underwater world rendered with WebGPU. Every visit grows a new reef: terrain, coral, plants, fish and creatures are all generated from a seed on the GPU."
    />
    <meta name="theme-color" content="#02101a" />
    <link rel="canonical" href="https://greggman.github.io/webgpu-aquarium/" />

    <!-- Open Graph (Facebook, Slack, Discord, LinkedIn, Mastodon...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WebGPU Aquarium" />
    <meta property="og:title" content="WebGPU Aquarium" />
    <meta
      property="og:description"
      content="A procedurally generated underwater world rendered with WebGPU. Every visit grows a new reef: terrain, coral, plants, fish and creatures are all generated from a seed on the GPU."
    />
    <meta
      property="og:url"
      content="https://greggman.github.io/webgpu-aquarium/"
    />
    <meta
      property="og:image"
      content="https://greggman.github.io/webgpu-aquarium/preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An underwater reef: a rocky rise covered in pink, purple and green coral, sea urchins, anemones and small fish, with caustics playing over the sand and deep blue water behind."
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WebGPU Aquarium" />
    <meta
      name="twitter:description"
      content="A procedurally generated underwater world rendered with WebGPU. Every visit grows a new reef: terrain, coral, plants, fish and creatures are all generated from a seed on the GPU."
    />
    <meta
      name="twitter:image"
      content="https://greggman.github.io/webgpu-aquarium/preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="An underwater reef: a rocky rise covered in pink, purple and green coral, sea urchins, anemones and small fish, with caustics playing over the sand and deep blue water behind."
    />
    <meta name="twitter:creator" content="@greggman" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* No overflow:hidden. Nothing here is in normal flow — the canvas and
           the overlays are all fixed — so there is nothing to scroll and no
           scrollbar to suppress. Hiding it globally only means anything that
           does overflow, such as a long error list or the unsupported-browser
           message on a small screen, becomes unreadable. overscroll-behavior
           stops the rubber-band and pull-to-refresh, which is what the page
           actually wanted. */
        overscroll-behavior: none;
        background: #02101a;
        color: #d8eef5;
        font:
          13px/1.4 system-ui,
          -apple-system,
          sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(10px, env(safe-area-inset-bottom));
        opacity: 0.75;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
      }
      /* The GPU profile is a long sorted list. Anchor it to the top instead, so
         that the total and the most expensive passes stay on screen and it is
         the cheap tail that falls off, and make it small enough to fit a phone:
         the page takes every touch for the camera, so it cannot be scrolled. */
      #hud.profile {
        top: max(10px, env(safe-area-inset-top));
        bottom: auto;
        font: clamp(8px, 2.5vw, 12px) / 1.3 ui-monospace, SFMono-Regular,
          Menlo, monospace;
      }
      #hud.hidden {
        opacity: 0;
        transition: opacity 1.5s;
      }
      #regenerate,
      #settings {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        background: rgba(2, 16, 26, 0.35);
        color: #e6f6fb;
        cursor: pointer;
        opacity: 0.7;
        z-index: 5;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        transition:
          opacity 0.2s,
          transform 0.4s;
      }
      #settings {
        right: auto;
        left: max(12px, env(safe-area-inset-left));
      }
      #regenerate:hover,
      #regenerate:focus-visible,
      #settings:hover,
      #settings:focus-visible {
        opacity: 1;
      }
      #regenerate:active {
        transform: rotate(180deg);
      }
      #settings:active {
        transform: rotate(60deg);
      }
      #settings-dialog {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 14px;
        background: rgba(2, 16, 26, 0.82);
        color: #e6f6fb;
        padding: 18px 20px;
        min-width: min(19rem, calc(100vw - 48px));
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      #settings-dialog::backdrop {
        background: rgba(0, 10, 18, 0.45);
      }
      #settings-dialog h2 {
        margin: 0 0 14px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      #settings-dialog label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        font-size: 15px;
      }
      #settings-dialog select {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 7px;
        padding: 5px 8px;
        font: inherit;
      }
      #settings-dialog input[type='checkbox'] {
        width: 17px;
        height: 17px;
        accent-color: #7fd8ef;
      }
      #settings-dialog .note {
        margin: -6px 0 14px;
        font-size: 12px;
        opacity: 0.6;
      }
      #settings-dialog .done {
        width: 100%;
        margin-top: 4px;
        padding: 9px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #regenerate[hidden] {
        display: none;
      }
      #regenerate[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        letter-spacing: 0.1em;
        pointer-events: none;
        transition: opacity 1s;
      }
      #errors {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        max-height: 50%;
        overflow: auto;
        margin: 0;
        padding: 8px 12px;
        background: rgba(120, 0, 0, 0.85);
        color: #fff;
        font:
          12px/1.4 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
        z-index: 10;
      }
      #unsupported {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: max(24px, env(safe-area-inset-top)) 24px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: left;
        background: radial-gradient(
          ellipse at 50% -10%,
          #1c6f86 0%,
          #073345 45%,
          #02101a 100%
        );
        user-select: text;
        -webkit-user-select: text;
      }
      #unsupported .card {
        max-width: 34rem;
        width: 100%;
        /* Centred with auto margins rather than justify-content: a centred flex
           item that overflows its container cannot be scrolled back to at the
           top, which on a short screen hides the start of the message. */
        margin: auto;
      }
      #unsupported h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      #unsupported p,
      #unsupported li {
        font-size: 15px;
        line-height: 1.5;
      }
      #unsupported ul {
        padding-left: 1.2em;
        margin: 8px 0 16px;
      }
      #unsupported li {
        margin-bottom: 8px;
      }
      #unsupported a {
        color: #8fe3ff;
      }
      .stick {
        position: fixed;
        width: 110px;
        height: 110px;
        margin: -55px 0 0 -55px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.25);
        pointer-events: none;
      }
      .stick > div {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="loading">generating ocean…</div>
    <div id="hud"></div>
    <button
      id="regenerate"
      type="button"
      title="Generate a new ocean"
      aria-label="Generate a new ocean"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          d="M20 12a8 8 0 1 1-2.34-5.66"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        />
        <path
          d="M20 3.5v5h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <button id="settings" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.9" />
        <circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.9" />
        <path
          d="M19.2 12.0L21.7 12.0M17.1 17.1L18.9 18.9M12.0 19.2L12.0 21.7M6.9 17.1L5.1 18.9M4.8 12.0L2.3 12.0M6.9 6.9L5.1 5.1M12.0 4.8L12.0 2.3M17.1 6.9L18.9 5.1"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <dialog id="settings-dialog">
      <h2>Settings</h2>
      <label>
        Quality
        <select id="set-quality">
          <option value="auto">Automatic</option>
          <option value="mobile">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="ultra">Ultra</option>
        </select>
      </label>
      <p class="note">Changing this rebuilds the reef.</p>
      <label><input type="checkbox" id="set-bloom" /> Glow</label>
      <label><input type="checkbox" id="set-grass" /> Seagrass</label>
      <label><input type="checkbox" id="set-dust" /> Drifting specks</label>
      <button class="done" id="set-done" type="button">Done</button>
    </dialog>
    <pre id="errors" hidden></pre>
    <script type="module" src="main.js"></script>
  </body>
</html>
