<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>WebGPU Aquarium</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="A procedurally generated underwater world rendered with WebGPU. Every visit grows a new reef: terrain, coral, plants, fish and creatures are all generated from a seed on the GPU."
    />
    <meta name="theme-color" content="#02101a" />
    <link rel="canonical" href="https://greggman.github.io/webgpu-aquarium/" />

    <!-- Open Graph (Facebook, Slack, Discord, LinkedIn, Mastodon...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WebGPU Aquarium" />
    <meta property="og:title" content="WebGPU Aquarium" />
    <meta
      property="og:description"
      content="A procedurally generated underwater world rendered with WebGPU. Every visit grows a new reef: terrain, coral, plants, fish and creatures are all generated from a seed on the GPU."
    />
    <meta
      property="og:url"
      content="https://greggman.github.io/webgpu-aquarium/"
    />
    <meta
      property="og:image"
      content="https://greggman.github.io/webgpu-aquarium/preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An underwater reef: a rocky rise covered in pink, purple and green coral, sea urchins, anemones and small fish, with caustics playing over the sand and deep blue water behind."
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WebGPU Aquarium" />
    <meta
      name="twitter:description"
      content="A procedurally generated underwater world rendered with WebGPU. Every visit grows a new reef: terrain, coral, plants, fish and creatures are all generated from a seed on the GPU."
    />
    <meta
      name="twitter:image"
      content="https://greggman.github.io/webgpu-aquarium/preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="An underwater reef: a rocky rise covered in pink, purple and green coral, sea urchins, anemones and small fish, with caustics playing over the sand and deep blue water behind."
    />
    <meta name="twitter:creator" content="@greggman" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #02101a;
        color: #d8eef5;
        font:
          13px/1.4 system-ui,
          -apple-system,
          sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(10px, env(safe-area-inset-bottom));
        opacity: 0.75;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
      }
      #hud.hidden {
        opacity: 0;
        transition: opacity 1.5s;
      }
      #regenerate {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        background: rgba(2, 16, 26, 0.35);
        color: #e6f6fb;
        cursor: pointer;
        opacity: 0.7;
        z-index: 5;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        transition:
          opacity 0.2s,
          transform 0.4s;
      }
      #regenerate:hover,
      #regenerate:focus-visible {
        opacity: 1;
      }
      #regenerate:active {
        transform: rotate(180deg);
      }
      #regenerate[hidden] {
        display: none;
      }
      #regenerate[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        letter-spacing: 0.1em;
        pointer-events: none;
        transition: opacity 1s;
      }
      #errors {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        max-height: 50%;
        overflow: auto;
        margin: 0;
        padding: 8px 12px;
        background: rgba(120, 0, 0, 0.85);
        color: #fff;
        font:
          12px/1.4 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
        z-index: 10;
      }
      #unsupported {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: max(24px, env(safe-area-inset-top)) 24px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: left;
        background: radial-gradient(
          ellipse at 50% -10%,
          #1c6f86 0%,
          #073345 45%,
          #02101a 100%
        );
        user-select: text;
        -webkit-user-select: text;
      }
      #unsupported .card {
        max-width: 34rem;
        width: 100%;
      }
      #unsupported h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      #unsupported p,
      #unsupported li {
        font-size: 15px;
        line-height: 1.5;
      }
      #unsupported ul {
        padding-left: 1.2em;
        margin: 8px 0 16px;
      }
      #unsupported li {
        margin-bottom: 8px;
      }
      #unsupported a {
        color: #8fe3ff;
      }
      .stick {
        position: fixed;
        width: 110px;
        height: 110px;
        margin: -55px 0 0 -55px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.25);
        pointer-events: none;
      }
      .stick > div {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="loading">generating ocean…</div>
    <div id="hud"></div>
    <button
      id="regenerate"
      type="button"
      title="Generate a new ocean"
      aria-label="Generate a new ocean"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          d="M20 12a8 8 0 1 1-2.34-5.66"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        />
        <path
          d="M20 3.5v5h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <pre id="errors" hidden></pre>
    <script type="module" src="main.js"></script>
  </body>
</html>
